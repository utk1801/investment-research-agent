x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://invest_agent:invest123@postgres:5432/invest_agent
    AIRFLOW__WEBSERVER__SECRET_KEY: investment-research-agent-local
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW_INGESTION_CONTAINER: invest_app
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    CHROMADB_HOST: chromadb
    CHROMADB_PORT: 8000
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy
    chromadb:
      condition: service_started
    app:
      condition: service_started

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: invest_postgres
    environment:
      POSTGRES_DB: invest_agent
      POSTGRES_USER: invest_agent
      POSTGRES_PASSWORD: invest123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invest_agent -d invest_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: invest_chroma
    volumes:
      - chroma_data:/chroma/chroma_db
    ports:
      - "8000:8000"
    
  # ── Streamlit App ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invest_app
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    ports:
      - "8501:8501"
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: invest_grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SERVER_PORT: 3000
      POSTGRES_DB: invest_agent
      POSTGRES_USER: invest_agent
      POSTGRES_PASSWORD: invest123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ── Airflow Orchestration ────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: invest_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Investment \
          --lastname Agent \
          --role Admin \
          --email airflow@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: invest_airflow_webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: invest_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  chroma_data:
  grafana_data:
  airflow_logs:

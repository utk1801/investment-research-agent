services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: invest_postgres
    environment:
      POSTGRES_DB: invest_agent
      POSTGRES_USER: invest_agent
      POSTGRES_PASSWORD: invest123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invest_agent -d invest_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: invest_chroma
    volumes:
      - chroma_data:/chroma/chroma_db
    ports:
      - "8000:8000"
    
  # ── Streamlit App ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invest_app
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    ports:
      - "8501:8501"
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: invest_grafana
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SERVER_PORT: 3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  chroma_data:
  grafana_data:
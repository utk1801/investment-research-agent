[project]
name = "investment-research-agent"
version = "0.1.0"
description = "End-to-end RAG investment research agent with hybrid search and LLM synthesis"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.2",
    "openai>=1.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]